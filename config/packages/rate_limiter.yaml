framework:
    rate_limiter:
        # Exercice 10 — 5 inscriptions par heure et par IP
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

        # Exercice 10 — 60 requêtes par minute et par IP
        api_topic:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
