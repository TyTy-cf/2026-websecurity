[www]
; Appliqué uniquement aux requêtes web (FPM), pas au CLI : composer et
; bin/console ont besoin d'accéder au filesystem hors de /var/www/html
; et de télécharger des fichiers.
; php_admin_* : non modifiable par le code via ini_set()

; Défense en profondeur : restreindre l'accès filesystem au code de l'app
php_admin_value[open_basedir] = /var/www/html:/tmp

; Réduit la surface d'attaque SSRF/inclusion distante (l'app n'a pas besoin
; d'ouvrir des flux HTTP/FTP via les fonctions fichiers)
php_admin_flag[allow_url_fopen] = off
