# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    session:
        cookie_secure: false
        cookie_httponly: false
        cookie_samesite: null
    rate_limiter:
        # Action précise (formulaire d'inscription) : quota bas par IP
        app_register:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # Famille de routes d'API en lecture publique : quota plus large par IP
        app_api_topic:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
