# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    session:
        # Exercice 1 — protections par défaut de Symfony restaurées
        cookie_secure: auto     # cookie envoyé uniquement sur HTTPS (interception réseau)
        cookie_httponly: true   # cookie invisible depuis document.cookie (vol par XSS)
        cookie_samesite: lax    # cookie non envoyé sur les requêtes cross-site (CSRF)

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
