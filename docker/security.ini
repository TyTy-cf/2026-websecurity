; Ne jamais divulguer la présence/version de PHP (en-tête X-Powered-By)
expose_php = Off

; Ne jamais afficher les erreurs dans la réponse HTTP : elles doivent être
; journalisées côté serveur, jamais renvoyées au visiteur
display_errors = Off
display_startup_errors = Off
html_errors = Off

; Journaliser systématiquement les erreurs PHP natives (indépendamment des
; logs applicatifs Symfony/Monolog), pour garder une trace exploitable
log_errors = On
error_log = /proc/self/fd/2

; Cookies de session durcis
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; open_basedir et allow_url_fopen sont définis dans docker/php-fpm-security.conf
; (pool FPM uniquement) pour ne pas casser le CLI (composer, bin/console)
