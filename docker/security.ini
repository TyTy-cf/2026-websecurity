; ============================================================
;  Durcissement PHP (exercice 12.1)
;  Chargé depuis /usr/local/etc/php/conf.d/ (voir docker/Dockerfile).
; ============================================================

; 1. Ne pas divulguer PHP (supprime l'en-tête X-Powered-By et les easter eggs ?=PHP...)
expose_php = Off

; 2. Ne jamais renvoyer les erreurs / traces au client ; on les journalise à la place.
;    Symfony continue d'afficher sa propre page d'erreur en dev : ceci ne masque
;    que la sortie brute de PHP.
display_errors = Off
display_startup_errors = Off
log_errors = On

; 3. Interdire l'inclusion de code distant (include/require d'une URL).
allow_url_include = Off

; 4. PHP-FPM : ne pas "deviner" le script à exécuter depuis PATH_INFO
;    (évite l'exécution d'un mauvais fichier).
cgi.fix_pathinfo = 0

; 5. Durcissement des sessions
session.use_strict_mode = 1         ; rejette un id de session fourni par l'attaquant (anti-fixation)
session.use_only_cookies = 1        ; n'accepte jamais l'id de session via l'URL
session.cookie_httponly = 1         ; cookie inaccessible au JavaScript (anti-vol par XSS)
session.cookie_secure = 1           ; cookie envoyé uniquement en HTTPS
session.cookie_samesite = "Lax"     ; atténue le CSRF
session.sid_length = 48             ; identifiants de session plus longs
session.sid_bits_per_character = 6  ; ... et plus entropiques

; 6. Désactiver les fonctions d'exécution shell (vecteurs de RCE via une faille web).
;    NB : proc_open / popen sont volontairement laissés actifs — Composer et le
;    composant Symfony Process en ont besoin. À étendre avec prudence.
disable_functions = exec,passthru,shell_exec,system

; 7. Options plus strictes (peuvent casser des choses — à activer en connaissance de cause) :
;    allow_url_fopen = Off               ; casse file_get_contents('https://...')
;    open_basedir = /var/www/html:/tmp   ; confine les accès disque de PHP
